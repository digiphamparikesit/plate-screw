<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Test Koneksi Supabase</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; max-width: 800px; margin: auto; }
    pre { background: #f4f4f4; padding: 16px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
    .ok { color: #0a7a3f; font-weight: 600; }
    .err { color: #b3352c; font-weight: 600; }
    .warn { color: #b4611e; font-weight: 600; }
  </style>
</head>
<body>
  <h2>🔌 Test Koneksi Supabase</h2>
  <pre id="out">Memuat…</pre>

  <script type="module">
    import { sb, selectView, callRpc, signIn, signOut } from './supabase-client.js';

    const out = document.getElementById('out');
    const log = (html) => { out.innerHTML += '\n' + html; };

    (async () => {
      out.innerHTML = '';

      // ── 1. Cek client init ────────────────────────────────
      try {
        const url = sb.supabaseUrl;
        log(`<span class="ok">✅ 1. Client init OK</span>`);
        log(`   URL: ${url}`);
      } catch (e) {
        log(`<span class="err">❌ 1. Client init GAGAL: ${e.message}</span>`);
        return;
      }

      // ── 2. Cek baca tabel (tanpa login, harus gagal karena RLS) ──
      try {
        const barang = await selectView('master_barang');
        log(`<span class="warn">⚠️ 2. Baca master_barang TANPA LOGIN berhasil (${barang.length} baris)</span>`);
        log(`   ⚠️ RLS mungkin belum ketat. Cek policy di Supabase.`);
      } catch (e) {
        log(`<span class="ok">✅ 2. Baca tanpa login ditolak (RLS aktif): ${e.message}</span>`);
      }

      // ── 3. Login sebagai admin ───────────────────────────
      try {
        const data = await signIn('admin@rsud.go.id', 'admin123');
        log(`<span class="ok">✅ 3. Login OK — user: ${data.user.email}</span>`);
      } catch (e) {
        log(`<span class="err">❌ 3. Login GAGAL: ${e.message}</span>`);
        log(`   → Pastikan user admin@rsud.go.id sudah dibuat di Supabase Authentication.`);
        return;
      }

      // ── 4. Baca tabel setelah login ──────────────────────
      try {
        const barang = await selectView('master_barang');
        log(`<span class="ok">✅ 4. Baca master_barang setelah login: ${barang.length} barang</span>`);
        barang.forEach(b => log(`   • ${b.kode_barang} — ${b.nama_barang}`));
      } catch (e) {
        log(`<span class="err">❌ 4. Baca GAGAL: ${e.message}</span>`);
      }

      // ── 5. Test RPC (generate kode) ──────────────────────
      try {
        const kode = await callRpc('rpc_generate_kode', { p_prefix: 'PL' });
        log(`<span class="ok">✅ 5. RPC generate_kode('PL') → ${kode}</span>`);
        log(`   (harusnya PL-003 karena seed sudah ada 2 plate)`);
      } catch (e) {
        log(`<span class="err">❌ 5. RPC GAGAL: ${e.message}</span>`);
      }

      // ── 6. Cek view stok ─────────────────────────────────
      try {
        const stok = await selectView('v_stok_saat_ini');
        log(`<span class="ok">✅ 6. View v_stok_saat_ini OK: ${stok.length} baris</span>`);
      } catch (e) {
        log(`<span class="err">❌ 6. View GAGAL: ${e.message}</span>`);
      }

      // ── 7. Cek view notifikasi ───────────────────────────
      try {
        const notif = await selectView('v_notifikasi_konsinyasi_open');
        log(`<span class="ok">✅ 7. View notifikasi OK: ${notif.length} open</span>`);
      } catch (e) {
        log(`<span class="err">❌ 7. View notifikasi GAGAL: ${e.message}</span>`);
      }

      // ── 8. Logout ────────────────────────────────────────
      try {
        await signOut();
        log(`<span class="ok">✅ 8. Logout OK</span>`);
      } catch (e) {
        log(`<span class="warn">⚠️ 8. Logout: ${e.message}</span>`);
      }

      log(`\n— Selesai —`);
    })();
  </script>
</body>
</html>
