<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventori Plate & Screw</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7f6;
      color: #1a2a28;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: #0b3b39;
      color: #e0edeb;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-brand {
      padding: 22px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sidebar-brand h1 { font-size:18px; font-weight:700; color:#fff; }
    .sidebar-brand small { display:block; font-size:12px; color:#9bb7b4; margin-top:2px; }
    .sidebar-nav {
      flex:1;
      padding:16px 12px;
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .sidebar-nav .menu-item {
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:8px;
      font-size:14px;
      font-weight:500;
      color:#c4dbd8;
      cursor:pointer;
      transition:background 0.15s, color 0.15s;
      border:none;
      background:transparent;
      width:100%;
      text-align:left;
    }
    .sidebar-nav .menu-item:hover { background:rgba(255,255,255,0.07); color:#fff; }
    .sidebar-nav .menu-item.active { background:#157a73; color:#fff; }
    .sidebar-nav .menu-item .icon { font-size:18px; width:24px; text-align:center; }
    .sidebar-footer { padding:16px 20px; border-top:1px solid rgba(255,255,255,0.06); font-size:12px; color:#7fa09c; }

    /* MAIN */
    .main-content { flex:1; display:flex; flex-direction:column; min-width:0; height:100vh; overflow:hidden; }
    .topbar {
      background:#fff;
      padding:16px 28px;
      border-bottom:1px solid #e2e8e6;
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-shrink:0;
    }
    .topbar h2 { font-size:18px; font-weight:600; color:#0b3b39; }
    .topbar .user { font-size:13px; color:#566461; }
    .page-content {
      flex:1;
      overflow-y:auto;
      padding:24px 28px 40px;
      background:#f4f7f6;
    }

    /* CARDS */
    .card {
      background:#fff;
      border-radius:12px;
      padding:20px 24px;
      margin-bottom:20px;
      border:1px solid #e2e8e6;
    }
    .card h3 { font-size:16px; font-weight:600; color:#0b3b39; margin-bottom:4px; }
    .card .sub { font-size:13px; color:#566461; margin-bottom:16px; }
    .field-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:14px 18px; }
    .field { display:flex; flex-direction:column; gap:4px; }
    .field label { font-size:12.5px; font-weight:500; color:#3f5451; }
    .field input, .field select {
      padding:8px 10px;
      border:1px solid #d4dfdc;
      border-radius:6px;
      font:inherit;
      font-size:13px;
      background:#fff;
    }
    .field input:focus, .field select:focus { outline:2px solid #157a73; border-color:transparent; }
    .btn {
      padding:9px 18px;
      border:none;
      border-radius:6px;
      font-weight:600;
      font-size:13px;
      cursor:pointer;
      background:#0b5d5a;
      color:#fff;
      transition:background 0.15s;
    }
    .btn:hover { background:#0a4a47; }
    .btn.secondary { background:#e4efed; color:#0b5d5a; }
    .btn.secondary:hover { background:#d0e3e0; }
    .btn:disabled { opacity:0.6; cursor:default; }

    .msg {
      margin-top:12px;
      padding:10px 14px;
      border-radius:6px;
      font-size:13px;
      display:none;
    }
    .msg.show { display:block; }
    .msg.ok { background:#e4f0ee; color:#0b5d5a; }
    .msg.err { background:#fbeae8; color:#b3352c; }

    /* TABEL */
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { padding:10px 12px; text-align:left; border-bottom:1px solid #e8eeec; }
    th { font-size:11px; text-transform:uppercase; letter-spacing:0.03em; color:#566461; font-weight:600; }
    td.num { text-align:right; font-family:monospace; }
    tr.anomaly td { background:#fbeae8; }
    tr.expiring td { background:#fbecdd; }
    .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:600; }
    .badge.warn { background:#b4611e; color:#fff; }
    .badge.bad { background:#b3352c; color:#fff; }

    .totals {
      display:flex;
      justify-content:flex-end;
      gap:30px;
      margin-top:14px;
      font-family:monospace;
    }
    .totals .n { font-size:18px; font-weight:600; color:#0b3b39; }
    .totals .l { display:block; font-size:11px; color:#566461; font-family:'Inter', sans-serif; }

    .paginasi {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:16px;
      padding-top:16px;
      border-top:1px solid #e2e8e6;
      font-size:13px;
      color:#566461;
    }
    .paginasi .btn-halaman {
      padding:5px 14px;
      border:1px solid #d4dfdc;
      border-radius:6px;
      background:#fff;
      cursor:pointer;
      font-weight:500;
    }
    .paginasi .btn-halaman:disabled { opacity:0.4; cursor:default; }
    .empty { text-align:center; padding:40px 10px; color:#566461; }

    /* FOTO */
    .foto-thumb { width:36px; height:36px; object-fit:cover; border-radius:6px; border:1px solid #d4dfdc; cursor:zoom-in; }
    .foto-placeholder { width:36px; height:36px; border-radius:6px; border:1px dashed #d4dfdc; display:flex; align-items:center; justify-content:center; color:#a0b8b4; font-size:10px; }
    .foto-upload-label { cursor:pointer; font-size:14px; }
    .foto-upload-label input[type="file"] { display:none; }

    /* MODAL FOTO */
    .foto-modal-overlay {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(11,42,40,0.82);
      z-index:999;
      align-items:center;
      justify-content:center;
      padding:32px;
      cursor:zoom-out;
    }
    .foto-modal-overlay.show { display:flex; }
    .foto-modal-img { max-width:90vw; max-height:90vh; border-radius:10px; background:#fff; }
    .foto-modal-close {
      position:absolute;
      top:20px;
      right:24px;
      width:40px;
      height:40px;
      border-radius:50%;
      border:none;
      background:rgba(255,255,255,0.15);
      color:#fff;
      font-size:28px;
      cursor:pointer;
    }

    @media (max-width:720px) {
      .sidebar { width:60px; }
      .sidebar-brand h1, .sidebar-brand small, .sidebar-nav .menu-item span:not(.icon) { display:none; }
      .sidebar-nav .menu-item { justify-content:center; padding:12px; }
      .topbar { padding:12px 16px; }
      .page-content { padding:16px; }
      .field-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <h1>🛠 P·S</h1>
    <small>Bedah Sentral</small>
  </div>
  <nav class="sidebar-nav">
    <button class="menu-item active" data-tab="stok"><span class="icon">📦</span><span>Stok Saat Ini</span></button>
    <button class="menu-item" data-tab="masterbarang"><span class="icon">📋</span><span>Master Barang</span></button>
    <button class="menu-item" data-tab="parlevel"><span class="icon">🎯</span><span>Par Level</span></button>
    <button class="menu-item" data-tab="masuk"><span class="icon">⬇️</span><span>Barang Masuk</span></button>
    <button class="menu-item" data-tab="mutasi"><span class="icon">🔄</span><span>Mutasi</span></button>
    <button class="menu-item" data-tab="keluar"><span class="icon">⬆️</span><span>Pengeluaran</span></button>
    <button class="menu-item" data-tab="penyesuaian"><span class="icon">✏️</span><span>Penyesuaian</span></button>
    <button class="menu-item" data-tab="opname"><span class="icon">📊</span><span>Laporan Opname</span></button>
    <button class="menu-item" data-tab="pemakaian"><span class="icon">📈</span><span>Laporan Pemakaian</span></button>
  </nav>
  <div class="sidebar-footer">v2.0</div>
</aside>

<!-- MAIN -->
<div class="main-content">
  <header class="topbar">
    <h2 id="page-title">Stok Saat Ini</h2>
    <span class="user" id="user-display">👤 Admin</span>
  </header>
  <div class="page-content" id="page-content"></div>
</div>

<!-- MODAL FOTO -->
<div class="foto-modal-overlay" id="foto-modal-overlay">
  <button class="foto-modal-close" id="foto-modal-close">&times;</button>
  <img class="foto-modal-img" id="foto-modal-img" src="" alt="">
</div>

<script>
  // --------------------------------------------------------------
  // NAVIGASI SIDEBAR
  // --------------------------------------------------------------
  var menuItems = document.querySelectorAll('.menu-item');
  var pageTitle = document.getElementById('page-title');
  var pageContent = document.getElementById('page-content');

  var currentTab = 'stok';
  var masterBarangTerakhir = [];
  var parLevelTerakhir = [];
  var stokDataTerakhir = null;
  var opnameDataTerakhir = null;
  var halamanStok = 1;
  var halamanMaster = 1;
  var PER_HALAMAN = 10;

  function navigateTo(tab) {
    currentTab = tab;
    menuItems.forEach(function(item) {
      item.classList.toggle('active', item.dataset.tab === tab);
    });
    var titles = {
      stok: 'Stok Saat Ini',
      masterbarang: 'Master Barang',
      parlevel: 'Par Level Konsinyasi',
      masuk: 'Barang Masuk',
      mutasi: 'Mutasi',
      keluar: 'Pengeluaran',
      penyesuaian: 'Penyesuaian Stok',
      opname: 'Laporan Opname',
      pemakaian: 'Laporan Pemakaian'
    };
    pageTitle.textContent = titles[tab] || tab;
    var renderMap = {
      stok: renderStokPanel,
      masterbarang: renderMasterPanel,
      parlevel: renderParLevelPanel,
      masuk: function() { renderTransaksiForm('masuk', 'Barang Masuk', 'Catat penerimaan dari gudang farmasi'); },
      mutasi: function() { renderTransaksiForm('mutasi', 'Mutasi', 'Pindahan dari gudang lain'); },
      keluar: function() { renderTransaksiForm('keluar', 'Pengeluaran', 'Pemakaian untuk pasien'); },
      penyesuaian: renderPenyesuaianPanel,
      opname: renderOpnamePanel,
      pemakaian: renderPemakaianPanel
    };
    if (renderMap[tab]) renderMap[tab]();
  }

  menuItems.forEach(function(item) {
    item.addEventListener('click', function() {
      navigateTo(item.dataset.tab);
    });
  });

  // --------------------------------------------------------------
  // FUNGSI UMUM
  // --------------------------------------------------------------
  function rupiah(n) {
    return 'Rp ' + Math.round(n).toLocaleString('id-ID');
  }

  function showMessage(id, text, type) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = text;
    el.className = 'msg show ' + (type || 'ok');
  }

  // --------------------------------------------------------------
  // STOK PANEL
  // --------------------------------------------------------------
  function renderStokPanel() {
    pageContent.innerHTML = `
      <div class="card">
        <h3>Stok Plate & Screw Saat Ini</h3>
        <div class="sub">Saldo real-time dari seluruh transaksi hingga hari ini.</div>
        <div class="field-grid" style="grid-template-columns:1fr 1fr auto;">
          <div class="field">
            <label>Status Kepemilikan</label>
            <select id="stok-status"><option value="">Semua Status</option></select>
          </div>
          <div class="field" style="flex-direction:row;align-items:center;gap:8px;padding-top:18px;">
            <input type="checkbox" id="stok-tampilkan-nol">
            <label for="stok-tampilkan-nol" style="font-weight:400;">Tampilkan stok nol</label>
          </div>
          <button class="btn" id="btn-stok-muat">Muat Ulang</button>
        </div>
        <div class="msg" id="msg-stok"></div>
        <div id="stok-tanggal" style="font-size:12px;color:#566461;margin-top:8px;"></div>
      </div>
      <div id="stok-hasil"></div>
    `;
    muatStatusDropdown('stok-status', function() {
      document.getElementById('btn-stok-muat').addEventListener('click', tampilkanStok);
      document.getElementById('stok-status').addEventListener('change', tampilkanStok);
      document.getElementById('stok-tampilkan-nol').addEventListener('change', tampilkanStok);
      tampilkanStok();
    });
  }

  function tampilkanStok() {
    var status = document.getElementById('stok-status').value;
    var sertakanNol = document.getElementById('stok-tampilkan-nol').checked;
    var msg = document.getElementById('msg-stok');
    var btn = document.getElementById('btn-stok-muat');
    btn.disabled = true; btn.textContent = 'Memuat…';
    msg.className = 'msg';

    google.script.run
      .withSuccessHandler(function(data) {
        btn.disabled = false; btn.textContent = 'Muat Ulang';
        stokDataTerakhir = data;
        halamanStok = 1;
        document.getElementById('stok-tanggal').textContent = 'Per ' + data.sebagai_tanggal;
        renderStokHasil(data);
      })
      .withFailureHandler(function(err) {
        btn.disabled = false; btn.textContent = 'Muat Ulang';
        msg.textContent = 'Gagal: ' + err.message;
        msg.className = 'msg show err';
      })
      .ambilStokSaatIni(status || null, sertakanNol);
  }

  function renderStokHasil(data) {
    var container = document.getElementById('stok-hasil');
    var html = '';

    if (data.kekuranganParLevel && data.kekuranganParLevel.length) {
      html += '<div class="card" style="background:#fbecdd;border-color:#f0d9b8;"><h3 style="color:#b4611e;">⚠ ' + data.kekuranganParLevel.length + ' barang di bawah par level</h3>';
      data.kekuranganParLevel.forEach(function(r) {
        html += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #f0d9b8;"><span><strong>' + r.nama_barang + '</strong> (' + r.vendor + ')</span><span>stok ' + r.stok_saat_ini + '/' + r.jumlah_standar + ' · kurang ' + r.kekurangan + '</span></div>';
      });
      html += '</div>';
    }

    if (data.expiringSoon && data.expiringSoon.length) {
      html += '<div class="card" style="background:#fbecdd;"><h3 style="color:#b4611e;">⚠ ' + data.expiringSoon.length + ' batch mendekati kadaluarsa</h3></div>';
    }

    if (data.per_status && data.per_status.length) {
      html += '<div class="card" style="display:flex;flex-wrap:wrap;gap:12px;">';
      data.per_status.forEach(function(s) {
        html += '<div style="background:#e4f0ee;padding:8px 14px;border-radius:8px;"><strong>' + s.status_kepemilikan + '</strong><br>' + s.total_item + ' item · ' + rupiah(s.total_nilai) + '</div>';
      });
      html += '</div>';
    }

    var rows = data.rows;
    var total = rows.reduce(function(s, r) { return s + r.jumlah_harga; }, 0);
    var totalObj = { total_item: rows.length, total_nilai: Math.round(total * 100) / 100 };

    var pagi = hitungHalaman(rows.length, halamanStok, PER_HALAMAN);
    halamanStok = pagi.halamanSaatIni;
    var mulai = (halamanStok - 1) * PER_HALAMAN;
    var rowsHalaman = rows.slice(mulai, mulai + PER_HALAMAN);

    html += '<div class="card"><div style="display:flex;gap:10px;margin-bottom:12px;"><input type="text" id="stok-cari" placeholder="Cari nama barang..." style="flex:1;padding:8px 12px;border:1px solid #d4dfdc;border-radius:6px;"></div>';
    html += '<div class="table-wrap">' + renderTabelStok(rowsHalaman, data.expiringSoon) + '</div>';
    html += renderPaginasiHTML(rows.length, halamanStok, pagi.totalHalaman);
    html += renderTotalHTML(totalObj);
    html += '</div>';

    container.innerHTML = html;

    document.getElementById('stok-cari').addEventListener('input', function() {
      halamanStok = 1;
      var q = this.value.trim().toLowerCase();
      var filtered = data.rows.filter(function(r) { return r.nama_barang.toLowerCase().indexOf(q) !== -1; });
      var totalF = filtered.reduce(function(s, r) { return s + r.jumlah_harga; }, 0);
      var totalObjF = { total_item: filtered.length, total_nilai: Math.round(totalF * 100) / 100 };
      var pagiF = hitungHalaman(filtered.length, halamanStok, PER_HALAMAN);
      halamanStok = pagiF.halamanSaatIni;
      var mulaiF = (halamanStok - 1) * PER_HALAMAN;
      var rowsF = filtered.slice(mulaiF, mulaiF + PER_HALAMAN);
      var containerTbl = document.querySelector('#stok-hasil .card:last-child');
      if (containerTbl) {
        containerTbl.querySelector('.table-wrap').innerHTML = renderTabelStok(rowsF, data.expiringSoon);
        containerTbl.querySelector('.paginasi').outerHTML = renderPaginasiHTML(filtered.length, halamanStok, pagiF.totalHalaman);
        containerTbl.querySelector('.totals').outerHTML = renderTotalHTML(totalObjF);
        attachPaginasiEvents(containerTbl, function() { halamanStok--; renderStokHasil(stokDataTerakhir); }, function() { halamanStok++; renderStokHasil(stokDataTerakhir); });
      }
    });
  }

  function renderTabelStok(rows, expiringSoon) {
    if (!rows.length) return '<div class="empty">Tidak ada data.</div>';
    var expiringKeys = {};
    (expiringSoon || []).forEach(function(x) { expiringKeys[x.kode_barang + '||' + x.no_batch] = true; });

    var html = '<table><thead><tr><th>Foto</th><th>Nama Barang</th><th>No. Batch</th><th>Status</th><th class="num">Jumlah</th><th class="num">Harga</th><th class="num">Jumlah Harga</th><th>Tgl Expired</th></tr></thead><tbody>';
    rows.forEach(function(r) {
      var isAnomali = r.no_batch.indexOf('ANOMALI') !== -1;
      var isExpiring = expiringKeys[r.kode_barang + '||' + r.no_batch];
      var cls = isAnomali ? 'anomaly' : (isExpiring ? 'expiring' : '');
      html += '<tr class="' + cls + '"><td>' + (r.foto_url ? '<img class="foto-thumb" src="' + r.foto_url + '" alt="">' : '<div class="foto-placeholder">-</div>') + '</td><td>' + r.nama_barang + '</td><td>' + r.no_batch + (isAnomali ? ' <span class="badge bad">anomali</span>' : '') + '</td><td>' + (r.status_kepemilikan || '-') + '</td><td class="num">' + r.jumlah.toLocaleString('id-ID') + '</td><td class="num">' + rupiah(r.harga) + '</td><td class="num">' + rupiah(r.jumlah_harga) + '</td><td>' + (r.tgl_expired || '-') + '</td></tr>';
    });
    html += '</tbody></table>';
    return html;
  }

  // --------------------------------------------------------------
  // MASTER BARANG PANEL
  // --------------------------------------------------------------
  function renderMasterPanel() {
    pageContent.innerHTML = `
      <div class="card">
        <h3 id="master-form-title">Tambah Barang Baru</h3>
        <div class="sub" id="master-form-sub">Isi data barang, lalu simpan.</div>
        <form id="form-master">
          <div class="field-grid">
            <div class="field"><label>Kode Barang</label><input type="text" name="kode_barang" required style="text-transform:uppercase;"></div>
            <div class="field"><label>Nama Barang</label><input type="text" name="nama_barang" required></div>
            <div class="field"><label>Kategori</label><input type="text" name="kategori" list="kat-list"><datalist id="kat-list"><option>Plate</option><option>Screw</option></datalist></div>
            <div class="field"><label>Satuan</label><input type="text" name="satuan" value="pcs"></div>
            <div class="field"><label>Harga (Rp)</label><input type="number" name="harga_terakhir" min="0" required></div>
            <div class="field"><label>Status Kepemilikan</label><select name="status_kepemilikan" class="pilih-status-wajib" required></select></div>
            <div class="field full"><label>Foto (opsional)</label><input type="file" name="foto" accept="image/*"></div>
          </div>
          <button class="btn" type="submit" id="master-submit-btn">Tambah</button>
          <button class="btn secondary" type="button" id="master-batal-edit" style="display:none;">Batal Edit</button>
          <div class="msg" id="msg-master"></div>
        </form>
      </div>
      <!-- IMPORT CSV -->
      <div class="card" style="border: 2px dashed #0b5d5a;">
        <h3>📤 Import Master Barang dari CSV</h3>
        <div class="sub">Upload file CSV dengan header: kode_barang,nama_barang,kategori,satuan,harga_terakhir,status_kepemilikan</div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <input type="file" id="csv-upload" accept=".csv">
          <button class="btn" id="btn-import-csv">Import CSV</button>
          <a id="csv-template-link" href="#" style="font-size:13px;color:#0b5d5a;cursor:pointer;">⬇ Download template CSV</a>
        </div>
        <div class="msg" id="msg-csv-import"></div>
      </div>
      <div class="card">
        <h3>Daftar Barang</h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
          <input type="text" id="master-cari" placeholder="Cari..." style="flex:1;padding:8px 12px;border:1px solid #d4dfdc;border-radius:6px;">
          <select id="master-filter-kategori"><option value="">Semua Kategori</option></select>
          <select id="master-filter-status"><option value="">Semua Status</option></select>
        </div>
        <div id="master-tabel-wrap"></div>
      </div>
    `;

    muatStatusDropdown('form-master [name="status_kepemilikan"]', function() {
      muatMasterBarang();
    });
    muatStatusDropdown('master-filter-status');

    document.getElementById('form-master').addEventListener('submit', handleMasterSubmit);
    document.getElementById('master-batal-edit').addEventListener('click', batalEditMaster);
    document.getElementById('master-cari').addEventListener('input', function() { halamanMaster = 1; renderMasterTable(); });
    document.getElementById('master-filter-kategori').addEventListener('change', function() { halamanMaster = 1; renderMasterTable(); });
    document.getElementById('master-filter-status').addEventListener('change', function() { halamanMaster = 1; renderMasterTable(); });

    // Event import CSV
    document.getElementById('btn-import-csv').addEventListener('click', handleImportCSV);
    document.getElementById('csv-template-link').addEventListener('click', function(e) {
      e.preventDefault();

  function renderMasterTable() {

      if (kat && (b.kategori || '').trim() !== kat) return false;
      if (stat && b.status_kepemilikan !== stat) return false;
      return true;
    });

    var pagi = hitungHalaman(filtered.length, halamanMaster, PER_HALAMAN);

  function handleMasterSubmit(e) {
    e.preventDefault();
    var form = e.target;
    var msg = document.getElementById('msg-master');
    var btn = document.getElementById('master-submit-btn');
    var data = {};
    new FormData(form).forEach(function(v, k) { if (k !== 'foto') data[k] = v; });
    data.kode_barang = (data.kode_barang || '').trim().toUpperCase();

    var fileInput = form.querySelector('input[name="foto"]');
    var file = fileInput && fileInput.files && fileInput.files[0];
    if (file) {
      if (file.size > 5 * 1024 * 1024) {
        msg.textContent = 'Foto maksimal 5 MB.';
        msg.className = 'msg show err';
        return;
      }
      var reader = new FileReader();
      reader.onload = function() {
        data.foto_base64 = reader.result.split(',')[1];
        data.foto_mime = file.type;
        data.foto_nama = file.name;
        kirimMaster(data, btn, msg);
      };
      reader.onerror = function() {
        msg.textContent = 'Gagal membaca file.';
        msg.className = 'msg show err';
      };
      reader.readAsDataURL(file);
    } else {
      kirimMaster(data, btn, msg);
    }
  }

  function kirimMaster(data, btn, msg) {
    btn.disabled = true; btn.textContent = 'Menyimpan…';
    msg.className = 'msg';
    var action = modeMaster === 'edit' ? 'perbaruiBarangMaster' : 'simpanBarangMaster';
    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false; btn.textContent = modeMaster === 'edit' ? 'Update Barang' : 'Tambah';
        msg.textContent = res.pesan;
        msg.className = 'msg show ' + (res.sukses ? 'ok' : 'err');
        if (res.sukses) {
          batalEditMaster();
          muatMasterBarang();
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false; btn.textContent = modeMaster === 'edit' ? 'Update Barang' : 'Tambah';
        msg.textContent = 'Error: ' + err.message;
        msg.className = 'msg show err';
      })
      [action](data);
  }

  function handleFotoUpload(e) {
    var input = e.target;
    var kode = input.dataset.kode;
    var file = input.files && input.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      alert('Foto maksimal 5 MB.');
      input.value = '';
      return;
    }
    var reader = new FileReader();
    reader.onload = function() {
      var base64 = reader.result.split(',')[1];
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.sukses) muatMasterBarang();
          else alert(res.pesan);
        })
        .withFailureHandler(function(err) { alert('Gagal upload: ' + err.message); })
        .simpanFotoBarang(kode, base64, file.type, file.name);
      input.value = '';
    };
    reader.readAsDataURL(file);
  }

  // Import CSV
  function handleImportCSV() {
    var input = document.getElementById('csv-upload');
    var msg = document.getElementById('msg-csv-import');
    var file = input.files && input.files[0];
    if (!file) {
      msg.textContent = 'Pilih file CSV terlebih dahulu.';
      msg.className = 'msg show err';
      return;
    }
    var reader = new FileReader();
    reader.onload = function(e) {
      var text = e.target.result;
      var lines = text.split('\n').filter(function(line) { return line.trim() !== ''; });
      if (lines.length < 2) {
        msg.textContent = 'File CSV kosong atau hanya header.';
        msg.className = 'msg show err';
        return;
      }
      var headers = lines[0].split(',').map(function(h) { return h.trim().toLowerCase(); });
      var expected = ['kode_barang','nama_barang','kategori','satuan','harga_terakhir','status_kepemilikan'];
      var missing = expected.filter(function(h) { return headers.indexOf(h) === -1; });
      if (missing.length) {
        msg.textContent = 'Header tidak lengkap. Butuh: ' + expected.join(', ');
        msg.className = 'msg show err';
        return;
      }
      var btn = document.getElementById('btn-import-csv');
      btn.disabled = true; btn.textContent = 'Mengimpor...';
      msg.className = 'msg';

      var dataArray = [];
      for (var i = 1; i < lines.length; i++) {
        var values = lines[i].split(',').map(function(v) { return v.trim(); });
        var row = {};
        headers.forEach(function(h, idx) { row[h] = values[idx] || ''; });
        dataArray.push(row);
      }

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false; btn.textContent = 'Import CSV';
          if (res.sukses) {
            msg.textContent = res.pesan;
            msg.className = 'msg show ok';
            if (res.detail && res.detail.length) {
              msg.textContent += ' Detail: ' + res.detail.slice(0,3).join('; ') + (res.detail.length > 3 ? ' ...' : '');
            }
            muatMasterBarang();
          } else {
            msg.textContent = res.pesan;
            msg.className = 'msg show err';
          }
          input.value = '';
        })
        .withFailureHandler(function(err) {
          btn.disabled = false; btn.textContent = 'Import CSV';
          msg.textContent = 'Gagal import: ' + err.message;
          msg.className = 'msg show err';
        })
        .importMasterBarangFromCSV(dataArray);
    };
    reader.readAsText(file);
  }

      .withSuccessHandler(function(data) {
        if (!data.transaksi.length) {
          el.innerHTML = '<div class="empty">Tidak ada data.</div>';
          totalEl.innerHTML = '';
          return;
        }
        var html = '<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Barang</th><th>Jenis</th><th class="num">Jumlah</th><th>Batch</th><th>Alasan</th><th>Oleh</th></tr></thead><tbody>';
        data.transaksi.forEach(function(r) {
          var warna = r.jenis === 'Tambah' ? 'color:#3E6B2E;' : 'color:#b3352c;';
          html += '<tr><td>' + r.tanggal + '</td><td>' + r.nama_barang + '</td><td style="' + warna + 'font-weight:600;">' + r.jenis + '</td><td class="num">' + r.jumlah.toLocaleString('id-ID') + '</td><td>' + (r.no_batch || '-') + '</td><td>' + (r.alasan || '-') + '</td><td>' + (r.user || '-') + '</td></tr>';
        });
        html += '</tbody></table></div>';
        el.innerHTML = html;
        totalEl.innerHTML = '<div><span class="l">Total Transaksi</span><span class="n">' + data.total_transaksi + '</span></div><div><span class="l">Total Tambah</span><span class="n">+' + data.total_unit_tambah.toLocaleString('id-ID') + '</span></div><div><span class="l">Total Kurang</span><span class="n">-' + data.total_unit_kurang.toLocaleString('id-ID') + '</span></div>';
      })
      .withFailureHandler(function(err) {
        el.innerHTML = '<div class="msg show err">Gagal: ' + err.message + '</div>';
      })
      .ambilLaporanPenyesuaian(mulai, akhir);
  }

  // --------------------------------------------------------------
  // LAPORAN OPNAME
  // --------------------------------------------------------------
  function renderOpnamePanel() {
    pageContent.innerHTML = `
      <div class="card">
        <h3>Laporan Stok Opname Bulanan</h3>
        <div class="sub">Rekap stok akhir periode.</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
          <div class="field"><label>Bulan</label><select id="opname-bulan"></select></div>
          <div class="field"><label>Tahun</label><select id="opname-tahun"></select></div>
          <div class="field"><label>Status</label><select id="opname-status"><option value="">Semua</option></select></div>
          <button class="btn" id="btn-opname">Tampilkan</button>
          <button class="btn secondary" id="btn-opname-export">Export</button>
        </div>
        <div class="msg" id="msg-opname"></div>
      </div>
      <div id="opname-hasil"></div>
    `;
    var now = new Date();
    var selB = document.getElementById('opname-bulan');
    var namaBulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    namaBulan.forEach(function(n, i) { selB.innerHTML += '<option value="' + (i+1) + '">' + n + '</option>'; });
    selB.value = now.getMonth() + 1;
    var selT = document.getElementById('opname-tahun');
    for (var y = now.getFullYear()-2; y <= now.getFullYear()+1; y++) selT.innerHTML += '<option value="' + y + '">' + y + '</option>';
    selT.value = now.getFullYear();

    muatStatusDropdown('opname-status');

    document.getElementById('btn-opname').addEventListener('click', tampilkanOpname);
    document.getElementById('btn-opname-export').addEventListener('click', function() {
      alert('Fitur export akan tersedia di versi berikutnya.');
    });
  }

  function tampilkanOpname() {
    var bulan = document.getElementById('opname-bulan').value;
    var tahun = document.getElementById('opname-tahun').value;
    var status = document.getElementById('opname-status').value;
    var msg = document.getElementById('msg-opname');
    var btn = document.getElementById('btn-opname');
    btn.disabled = true; btn.textContent = 'Memuat…';
    msg.className = 'msg';
    google.script.run
      .withSuccessHandler(function(data) {
        btn.disabled = false; btn.textContent = 'Tampilkan';
        opnameDataTerakhir = data;
        renderOpnameHasil(data);
      })
      .withFailureHandler(function(err) {
        btn.disabled = false; btn.textContent = 'Tampilkan';
        msg.textContent = 'Gagal: ' + err.message;
        msg.className = 'msg show err';
      })
      .ambilLaporanOpname(bulan, tahun, status || null);
  }

  function renderOpnameHasil(data) {
    var container = document.getElementById('opname-hasil');
    var html = '';

    if (data.expiringSoon && data.expiringSoon.length) {
      html += '<div class="card" style="background:#fbecdd;"><h3 style="color:#b4611e;">⚠ ' + data.expiringSoon.length + ' batch mendekati kadaluarsa</h3></div>';
    }

    if (data.laporan.per_status && data.laporan.per_status.length) {
      html += '<div class="card" style="display:flex;flex-wrap:wrap;gap:12px;">';
      data.laporan.per_status.forEach(function(s) {
        html += '<div style="background:#e4f0ee;padding:8px 14px;border-radius:8px;"><strong>' + s.status_kepemilikan + '</strong><br>' + s.total_item + ' item · ' + rupiah(s.total_nilai) + '</div>';
      });
      html += '</div>';
    }

    var rows = data.laporan.rows;
    var total = rows.reduce(function(s, r) { return s + r.jumlah_harga; }, 0);
    var totalObj = { total_item: rows.length, total_nilai: Math.round(total * 100) / 100 };

    html += '<div class="card"><div style="display:flex;gap:10px;margin-bottom:12px;"><input type="text" id="opname-cari" placeholder="Cari nama barang..." style="flex:1;padding:8px 12px;border:1px solid #d4dfdc;border-radius:6px;"></div>';
    html += '<div class="table-wrap">' + renderTabelStok(rows, data.expiringSoon) + '</div>';
    html += renderTotalHTML(totalObj);
    html += '</div>';

    container.innerHTML = html;

    document.getElementById('opname-cari').addEventListener('input', function() {
      var q = this.value.trim().toLowerCase();
      var filtered = data.laporan.rows.filter(function(r) { return r.nama_barang.toLowerCase().indexOf(q) !== -1; });
      var totalF = filtered.reduce(function(s, r) { return s + r.jumlah_harga; }, 0);
      var totalObjF = { total_item: filtered.length, total_nilai: Math.round(totalF * 100) / 100 };
      var tbl = container.querySelector('.table-wrap');
      if (tbl) tbl.innerHTML = renderTabelStok(filtered, data.expiringSoon);
      var tot = container.querySelector('.totals');
      if (tot) tot.outerHTML = renderTotalHTML(totalObjF);
    });
  }

  // --------------------------------------------------------------
  // LAPORAN PEMAKAIAN
  // --------------------------------------------------------------
  function renderPemakaianPanel() {
    pageContent.innerHTML = `
      <div class="card">
        <h3>Laporan Pemakaian</h3>
        <div class="sub">Daftar transaksi pengeluaran dalam rentang tanggal.</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
          <div class="field"><label>Dari</label><input type="date" id="pemakaian-mulai"></div>
          <div class="field"><label>Sampai</label><input type="date" id="pemakaian-akhir"></div>
          <div class="field"><label>Vendor</label><select id="pemakaian-status"><option value="">Semua</option></select></div>
          <button class="btn" id="btn-pemakaian">Tampilkan</button>
          <button class="btn secondary" id="btn-pemakaian-export">Export</button>
        </div>
        <div class="msg" id="msg-pemakaian"></div>
      </div>
      <div id="pemakaian-hasil"></div>
    `;
    var today = new Date().toISOString().slice(0,10);
    var awalBulan = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);
    document.getElementById('pemakaian-mulai').value = awalBulan;
    document.getElementById('pemakaian-akhir').value = today;
    muatStatusDropdown('pemakaian-status');

    document.getElementById('btn-pemakaian').addEventListener('click', tampilkanPemakaian);
    document.getElementById('btn-pemakaian-export').addEventListener('click', function() {
      alert('Fitur export akan tersedia di versi berikutnya.');
    });
  }

  function tampilkanPemakaian() {
    var mulai = document.getElementById('pemakaian-mulai').value;
    var akhir = document.getElementById('pemakaian-akhir').value;
    var status = document.getElementById('pemakaian-status').value;
    var msg = document.getElementById('msg-pemakaian');
    var btn = document.getElementById('btn-pemakaian');
    if (!mulai || !akhir) return alert('Pilih tanggal.');
    btn.disabled = true; btn.textContent = 'Memuat…';
    msg.className = 'msg';
    google.script.run
      .withSuccessHandler(function(data) {
        btn.disabled = false; btn.textContent = 'Tampilkan';
        renderPemakaianHasil(data);
      })
      .withFailureHandler(function(err) {
        btn.disabled = false; btn.textContent = 'Tampilkan';
        msg.textContent = 'Gagal: ' + err.message;
        msg.className = 'msg show err';
      })
      .ambilLaporanPemakaian(mulai, akhir, status || null);
  }

  function renderPemakaianHasil(data) {
    var container = document.getElementById('pemakaian-hasil');
    var html = '<div class="card"><h3>Transaksi</h3>';
    if (!data.transaksi.length) {
      html += '<div class="empty">Tidak ada data.</div>';
    } else {
      var tbl = '<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Pasien</th><th>RM</th><th>Barang</th><th class="num">Jumlah</th><th>Vendor</th><th>Tujuan</th></tr></thead><tbody>';
      data.transaksi.forEach(function(r) {
        tbl += '<tr><td>' + r.tanggal + '</td><td>' + (r.nama_pasien || '-') + '</td><td>' + (r.no_rekam_medik || '-') + '</td><td>' + r.nama_barang + '</td><td class="num">' + r.jumlah.toLocaleString('id-ID') + '</td><td>' + r.status_kepemilikan + '</td><td>' + (r.tujuan || '-') + '</td></tr>';
      });
      tbl += '</tbody></table></div>';
      html += tbl;
    }
    html += '<div class="totals"><div><span class="l">Total Transaksi</span><span class="n">' + data.total_transaksi + '</span></div><div><span class="l">Total Unit</span><span class="n">' + data.total_unit_terpakai.toLocaleString('id-ID') + '</span></div></div></div>';

    html += '<div class="card"><h3>Rekap per Barang</h3>';
    if (!data.rekap_per_barang.length) {
      html += '<div class="empty">Tidak ada data.</div>';
    } else {
      var tbl2 = '<div class="table-wrap"><table><thead><tr><th>Barang</th><th class="num">Jml Transaksi</th><th class="num">Total Terpakai</th></tr></thead><tbody>';
      data.rekap_per_barang.forEach(function(r) {
        tbl2 += '<tr><td>' + r.nama_barang + '</td><td class="num">' + r.jumlah_transaksi + '</td><td class="num">' + r.total_terpakai.toLocaleString('id-ID') + '</td></tr>';
      });
      tbl2 += '</tbody></table></div>';
      html += tbl2;
    }
    html += '</div>';

    container.innerHTML = html;
  }

  // --------------------------------------------------------------
  // HELPERS DROPDOWN
  // --------------------------------------------------------------
  function muatStatusDropdown(selector, callback) {
    google.script.run
      .withSuccessHandler(function(list) {
        var opts = list.map(function(s) { return '<option value="' + s + '">' + s + '</option>'; }).join('');
        document.querySelectorAll(selector).forEach(function(el) {
          if (el.tagName === 'SELECT') {
            var current = el.value;
            el.innerHTML = (el.classList.contains('pilih-status-wajib') ? '<option value="" disabled selected>Pilih status…</option>' : '') +
              (el.classList.contains('pilih-status-opsional') ? '<option value="">(ikut default)</option>' : '') +
              opts;
            if (current) el.value = current;
          }
        });
        if (callback) callback();
      })
      .withFailureHandler(function(err) { console.error(err); })
      .getStatusBarangList();
  }

  function muatBarangDropdown(selector) {
    google.script.run
      .withSuccessHandler(function(list) {
        var opts = list.map(function(b) { return '<option value="' + b.kode_barang + '">' + b.kode_barang + ' — ' + b.nama_barang + '</option>'; }).join('');
        document.querySelectorAll(selector).forEach(function(el) {
          if (el.tagName === 'SELECT') {
            var current = el.value;
            el.innerHTML = '<option value="" disabled selected>Pilih barang…</option>' + opts;
            if (current) el.value = current;
          }
        });
      })
      .withFailureHandler(function(err) { console.error(err); })
      .getMasterBarang();
  }

  // --------------------------------------------------------------
  // PAGINASI & TOTAL
  // --------------------------------------------------------------
  function hitungHalaman(total, halaman, per) {
    var totalHalaman = Math.max(1, Math.ceil(total / per));
    if (halaman > totalHalaman) halaman = totalHalaman;
    if (halaman < 1) halaman = 1;
    return { totalHalaman: totalHalaman, halamanSaatIni: halaman };
  }

  function renderPaginasiHTML(total, halaman, totalHalaman) {
    return '<div class="paginasi"><button class="btn-halaman" id="paging-prev" ' + (halaman <= 1 ? 'disabled' : '') + '>‹ Sebelumnya</button><span>Halaman ' + halaman + ' dari ' + totalHalaman + ' · ' + total + ' item</span><button class="btn-halaman" id="paging-next" ' + (halaman >= totalHalaman ? 'disabled' : '') + '>Selanjutnya ›</button></div>';
  }

  function attachPaginasiEvents(container, onPrev, onNext) {
    var prev = container.querySelector('#paging-prev');
    var next = container.querySelector('#paging-next');
    if (prev) prev.addEventListener('click', onPrev);
    if (next) next.addEventListener('click', onNext);
  }

  function renderTotalHTML(obj) {
    return '<div class="totals"><div><span class="l">Total Item</span><span class="n">' + obj.total_item + '</span></div><div><span class="l">Total Nilai</span><span class="n">' + rupiah(obj.total_nilai) + '</span></div></div>';
  }

  // --------------------------------------------------------------
  // FOTO MODAL
  // --------------------------------------------------------------
  document.getElementById('foto-modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) document.getElementById('foto-modal-overlay').classList.remove('show');
  });
  document.getElementById('foto-modal-close').addEventListener('click', function() {
    document.getElementById('foto-modal-overlay').classList.remove('show');
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') document.getElementById('foto-modal-overlay').classList.remove('show');
  });

  // Event delegation untuk foto thumb
  document.addEventListener('click', function(e) {
    if (e.target.classList.contains('foto-thumb')) {
      var url = e.target.getAttribute('src');
      if (url) {
        document.getElementById('foto-modal-img').src = url;
        document.getElementById('foto-modal-overlay').classList.add('show');
      }
    }
  });

  // --------------------------------------------------------------
  // INIT - mulai dari Stok
  // --------------------------------------------------------------
  navigateTo('stok');

  // Set default dates untuk input date yang belum terset
  var todayDate = new Date().toISOString().slice(0,10);
  document.querySelectorAll('input[type="date"][name="tanggal"]').forEach(function(inp) {
    if (!inp.value) inp.value = todayDate;
  });
</script>
