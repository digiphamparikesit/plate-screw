<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventori Plate & Screw</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f4f7f6; color: #1a2a28; display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 240px; background: #0b3b39; color: #e0edeb; display: flex; flex-direction: column; flex-shrink: 0; height: 100vh; overflow-y: auto; box-shadow: 2px 0 12px rgba(0,0,0,0.08); }
    .sidebar-brand { padding: 22px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-brand h1 { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
    .sidebar-brand small { display: block; font-size: 12px; color: #9bb7b4; margin-top: 2px; }
    .sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; }
    .sidebar-nav .menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; color: #c4dbd8; cursor: pointer; transition: background 0.15s, color 0.15s; border: none; background: transparent; width: 100%; text-align: left; }
    .sidebar-nav .menu-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
    .sidebar-nav .menu-item.active { background: #157a73; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .sidebar-nav .menu-item .icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
    .sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 12px; color: #7fa09c; }
    .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100vh; overflow: hidden; }
    .topbar { background: #fff; padding: 16px 28px; border-bottom: 1px solid #e2e8e6; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .topbar h2 { font-size: 18px; font-weight: 600; color: #0b3b39; }
    .topbar .user { font-size: 13px; color: #566461; }
    .page-content { flex: 1; overflow-y: auto; padding: 24px 28px 40px; background: #f4f7f6; }
    .card { background: #fff; border-radius: 12px; padding: 20px 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); border: 1px solid #e2e8e6; }
    .card h3 { font-size: 16px; font-weight: 600; color: #0b3b39; margin-bottom: 4px; }
    .card .sub { font-size: 13px; color: #566461; margin-bottom: 16px; }
    .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px 18px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: 12.5px; font-weight: 500; color: #3f5451; }
    .field input, .field select { padding: 8px 10px; border: 1px solid #d4dfdc; border-radius: 6px; font: inherit; font-size: 13px; background: #fff; }
    .field input:focus, .field select:focus { outline: 2px solid #157a73; border-color: transparent; }
    .btn { padding: 9px 18px; border: none; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; background: #0b5d5a; color: #fff; transition: background 0.15s; }
    .btn:hover { background: #0a4a47; }
    .btn.secondary { background: #e4efed; color: #0b5d5a; }
    .btn.secondary:hover { background: #d0e3e0; }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .msg { margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 13px; display: none; }
    .msg.show { display: block; }
    .msg.ok { background: #e4f0ee; color: #0b5d5a; }
    .msg.err { background: #fbeae8; color: #b3352c; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e8eeec; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: #566461; font-weight: 600; }
    td.num { text-align: right; font-family: monospace; }
    tr.anomaly td { background: #fbeae8; }
    tr.expiring td { background: #fbecdd; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge.warn { background: #b4611e; color: #fff; }
    .badge.bad { background: #b3352c; color: #fff; }
    .totals { display: flex; justify-content: flex-end; gap: 30px; margin-top: 14px; font-family: monospace; }
    .totals .n { font-size: 18px; font-weight: 600; color: #0b3b39; }
    .totals .l { display: block; font-size: 11px; color: #566461; font-family: 'Inter', sans-serif; }
    .paginasi { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid #e2e8e6; font-size: 13px; color: #566461; }
    .paginasi .btn-halaman { padding: 5px 14px; border: 1px solid #d4dfdc; border-radius: 6px; background: #fff; cursor: pointer; font-weight: 500; }
    .paginasi .btn-halaman:disabled { opacity: 0.4; cursor: default; }
    .empty { text-align: center; padding: 40px 10px; color: #566461; }
    .foto-thumb { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; border: 1px solid #d4dfdc; cursor: zoom-in; }
    .foto-placeholder { width: 36px; height: 36px; border-radius: 6px; border: 1px dashed #d4dfdc; display: flex; align-items: center; justify-content: center; color: #a0b8b4; font-size: 10px; }
    .foto-upload-label { cursor: pointer; font-size: 14px; }
    .foto-upload-label input[type="file"] { display: none; }
    .foto-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(11,42,40,0.82); z-index: 999; align-items: center; justify-content: center; padding: 32px; cursor: zoom-out; }
    .foto-modal-overlay.show { display: flex; }
    .foto-modal-img { max-width: 90vw; max-height: 90vh; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,0.45); background: #fff; }
    .foto-modal-close { position: absolute; top: 20px; right: 24px; width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 28px; cursor: pointer; }
    @media (max-width: 720px) { .sidebar { width: 60px; } .sidebar-brand h1, .sidebar-brand small, .sidebar-nav .menu-item span:not(.icon) { display: none; } .sidebar-nav .menu-item { justify-content: center; padding: 12px; } .topbar { padding: 12px 16px; } .page-content { padding: 16px; } .field-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <h1>🛠 P·S</h1>
    <small>Bedah Sentral</small>
  </div>
  <nav class="sidebar-nav">
    <button class="menu-item active" data-tab="stok"><span class="icon">📦</span> <span>Stok Saat Ini</span></button>
    <button class="menu-item" data-tab="masterbarang"><span class="icon">📋</span> <span>Master Barang</span></button>
    <button class="menu-item" data-tab="parlevel"><span class="icon">🎯</span> <span>Par Level</span></button>
    <button class="menu-item" data-tab="masuk"><span class="icon">⬇️</span> <span>Barang Masuk</span></button>
    <button class="menu-item" data-tab="mutasi"><span class="icon">🔄</span> <span>Mutasi</span></button>
    <button class="menu-item" data-tab="keluar"><span class="icon">⬆️</span> <span>Pengeluaran</span></button>
    <button class="menu-item" data-tab="penyesuaian"><span class="icon">✏️</span> <span>Penyesuaian</span></button>
    <button class="menu-item" data-tab="opname"><span class="icon">📊</span> <span>Laporan Opname</span></button>
    <button class="menu-item" data-tab="pemakaian"><span class="icon">📈</span> <span>Laporan Pemakaian</span></button>
  </nav>
  <div class="sidebar-footer">v2.0 · GitHub Pages</div>
</aside>

<div class="main-content">
  <header class="topbar">
    <h2 id="page-title">Stok Saat Ini</h2>
    <span class="user" id="user-display">👤 Admin</span>
  </header>
  <div class="page-content" id="page-content"></div>
</div>

<div class="foto-modal-overlay" id="foto-modal-overlay">
  <button class="foto-modal-close" id="foto-modal-close">&times;</button>
  <img class="foto-modal-img" id="foto-modal-img" src="" alt="">
</div>

<script>
  // GANTI API_BASE DENGAN URL APPS SCRIPT ANDA (SETELAH DEPLOY)
  const API_BASE = 'https://script.google.com/macros/s/AKfycbxppo7ctZDoeMTzMAtRxN_1Ic1hZvWR3LobXLqdOHeBMtTi2tPkV-jxBsyrX3JUQ40/exec';

  let masterBarangTerakhir = [];
  let parLevelTerakhir = [];
  let stokDataTerakhir = null;
  let opnameDataTerakhir = null;
  let halamanStok = 1;
  let halamanMaster = 1;
  const PER_HALAMAN = 10;

  function rupiah(n) { return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }

  async function apiCall(action, params = {}, method = 'GET') {
    let url = `${API_BASE}?action=${encodeURIComponent(action)}`;
    let options = { method: method, redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' } };
    if (method === 'GET') {
      const queryParams = Object.keys(params).filter(k => params[k] !== undefined && params[k] !== null && params[k] !== '').map(k => `${encodeURIComponent(k)}=${encodeURIComponent(params[k])}`).join('&');
      if (queryParams) url += '&' + queryParams;
    } else { options.body = JSON.stringify(params); }
    const response = await fetch(url, options);
    if (!response.ok) { const errorText = await response.text(); throw new Error(`HTTP ${response.status}: ${errorText}`); }
    const result = await response.json();
    if (result.status === 'error') { throw new Error(result.message || 'Terjadi kesalahan'); }
    return result.data;
  }

  const menuItems = document.querySelectorAll('.menu-item');
  const pageTitle = document.getElementById('page-title');
  const pageContent = document.getElementById('page-content');

  const tabMap = {
    stok: { title: 'Stok Saat Ini', render: renderStokPanel },
    masterbarang: { title: 'Master Barang', render: renderMasterPanel },
    parlevel: { title: 'Par Level Konsinyasi', render: renderParLevelPanel },
    masuk: { title: 'Barang Masuk', render: renderMasukPanel },
    mutasi: { title: 'Mutasi', render: renderMutasiPanel },
    keluar: { title: 'Pengeluaran', render: renderKeluarPanel },
    penyesuaian: { title: 'Penyesuaian Stok', render: renderPenyesuaianPanel },
    opname: { title: 'Laporan Opname', render: renderOpnamePanel },
    pemakaian: { title: 'Laporan Pemakaian', render: renderPemakaianPanel }
  };

  let currentTab = 'stok';
  function navigateTo(tab) {
    currentTab = tab;
    menuItems.forEach(item => { item.classList.toggle('active', item.dataset.tab === tab); });
    const config = tabMap[tab];
    if (!config) return;
    pageTitle.textContent = config.title;
    config.render();
  }
  menuItems.forEach(item => { item.addEventListener('click', () => navigateTo(item.dataset.tab)); });

  function downloadTemplateCSV() {
    const headers = ['kode_barang','nama_barang','kategori','satuan','harga_terakhir','status_kepemilikan'];
    const contoh = ['PL-003','Plate Reconstruction 4.5mm','Plate','pcs','350000','Milik RS'];
    const csv = headers.join(',') + '\n' + contoh.join(',');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'template_master_barang.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function muatStatusDropdown(selector) {
    const fallbackList = ['Milik RS', 'Konsinyasi Surgika', 'Konsinyasi Osteomed', 'Konsinyasi Sinergi', 'Konsinyasi Adikasi & Biomed', 'Konsinyasi Mitra Fajar', 'Konsinyasi Osteomed Dr. Beatrix', 'Konsinyasi Osteomed Dr. Yahya'];
    let list = [];
    try { list = await apiCall('getStatusBarangList'); } catch (err) { console.warn('Fallback status', err); list = fallbackList; }
    const opts = list.map(s => `<option value="${s}">${s}</option>`).join('');
    document.querySelectorAll(selector).forEach(el => {
      if (el.tagName === 'SELECT') {
        const current = el.value; const isWajib = el.classList.contains('pilih-status-wajib'); const isOpsional = el.classList.contains('pilih-status-opsional');
        let html = '';
        if (isWajib) html += '<option value="" disabled selected>Pilih status…</option>';
        if (isOpsional) html += '<option value="">(ikut default)</option>';
        html += opts; el.innerHTML = html; if (current) el.value = current;
      }
    });
  }

  async function muatBarangDropdown(selector) {
    try {
      const list = await apiCall('getMasterBarang');
      masterBarangTerakhir = list;
      const opts = list.map(b => `<option value="${b.kode_barang}">${b.kode_barang} — ${b.nama_barang}</option>`).join('');
      document.querySelectorAll(selector).forEach(el => {
        if (el.tagName === 'SELECT') { const current = el.value; el.innerHTML = '<option value="" disabled selected>Pilih barang…</option>' + opts; if (current) el.value = current; }
      });
    } catch (err) { console.error('Gagal muat barang:', err); }
  }

  // ---------- STOK ----------
  function renderStokPanel() {
    pageContent.innerHTML = `
      <div class="card">
        <h3>Stok Plate & Screw Saat Ini</h3>
        <div class="sub">Saldo real-time dari seluruh transaksi hingga hari ini.</div>
        <div class="field-grid" style="grid-template-columns: 1fr 1fr auto;">
          <div class="field"><label>Status Kepemilikan</label><select id="stok-status"><option value="">Semua Status</option></select></div>
          <div class="field" style="flex-direction:row;align-items:center;gap:8px;padding-top:18px;"><input type="checkbox" id="stok-tampilkan-nol"><label for="stok-tampilkan-nol" style="font-weight:400;">Tampilkan stok nol</label></div>
          <button class="btn" id="btn-stok-muat">Muat Ulang</button>
        </div>
        <div class="msg" id="msg-stok"></div>
        <div id="stok-tanggal" style="font-size:12px;color:#566461;margin-top:8px;"></div>
      </div>
      <div id="stok-hasil"></div>
    `;
    muatStatusDropdown('#stok-status').then(() => {
      document.getElementById('btn-stok-muat').addEventListener('click', tampilkanStok);
      document.getElementById('stok-status').addEventListener('change', tampilkanStok);
      document.getElementById('stok-tampilkan-nol').addEventListener('change', tampilkanStok);
      tampilkanStok();
    });
  }

  async function tampilkanStok() {
    const status = document.getElementById('stok-status').value;
    const sertakanNol = document.getElementById('stok-tampilkan-nol').checked;
    const msg = document.getElementById('msg-stok'); const btn = document.getElementById('btn-stok-muat');
    btn.disabled = true; btn.textContent = 'Memuat…'; msg.className = 'msg';
    try {
      const data = await apiCall('ambilStokSaatIni', { status: status || null, sertakanNol });
      stokDataTerakhir = data; halamanStok = 1;
      document.getElementById('stok-tanggal').textContent = 'Per ' + data.sebagai_tanggal;
      renderStokHasil(data);
    } catch (err) { msg.textContent = 'Gagal: ' + err.message; msg.className = 'msg show err'; }
    finally { btn.disabled = false; btn.textContent = 'Muat Ulang'; }
  }

  function renderStokHasil(data) {
    const container = document.getElementById('stok-hasil'); let html = '';
    if (data.kekuranganParLevel && data.kekuranganParLevel.length) {
      html += `<div class="card" style="background:#fbecdd;border-color:#f0d9b8;"><h3 style="color:#b4611e;">⚠ ${data.kekuranganParLevel.length} barang di bawah par level</h3>
        ${data.kekuranganParLevel.map(r => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid #f0d9b8;"><span><strong>${r.nama_barang}</strong> (${r.vendor})</span><span>stok ${r.stok_saat_ini}/${r.jumlah_standar} · kurang ${r.kekurangan}</span></div>`).join('')}
      </div>`;
    }
    if (data.expiringSoon && data.expiringSoon.length) html += `<div class="card" style="background:#fbecdd;border-color:#f0d9b8;"><h3 style="color:#b4611e;">⚠ ${data.expiringSoon.length} batch mendekati kadaluarsa</h3></div>`;
    if (data.per_status && data.per_status.length) {
      html += `<div class="card" style="display:flex;flex-wrap:wrap;gap:12px;">${data.per_status.map(s => `<div style="background:#e4f0ee;padding:8px 14px;border-radius:8px;"><strong>${s.status_kepemilikan}</strong><br>${s.total_item} item · ${rupiah(s.total_nilai)}</div>`).join('')}</div>`;
    }

    const rows = data.rows;
    const total = rows.reduce((sum, r) => sum + r.jumlah_harga, 0);
    const totalObj = { total_item: rows.length, total_nilai: Math.round(total * 100) / 100 };
    const pagi = hitungHalaman(rows.length, halamanStok, PER_HALAMAN);
    halamanStok = pagi.halamanSaatIni;
    const mulai = (halamanStok - 1) * PER_HALAMAN;
    const rowsHalaman = rows.slice(mulai, mulai + PER_HALAMAN);

    html += `<div class="card"><div style="display:flex;gap:10px;margin-bottom:12px;"><input type="text" id="stok-cari" placeholder="Cari nama barang..." style="flex:1;padding:8px 12px;border:1px solid #d4dfdc;border-radius:6px;"></div>
      <div class="table-wrap">${renderTabelStok(rowsHalaman, data.expiringSoon)}</div>
      ${renderPaginasiHTML(rows.length, halamanStok, pagi.totalHalaman)}${renderTotalHTML(totalObj)}</div>`;

    container.innerHTML = html;
    document.getElementById('stok-cari').addEventListener('input', function() {
      halamanStok = 1; const q = this.value.trim().toLowerCase(); const filtered = data.rows.filter(r => r.nama_barang.toLowerCase().includes(q));
      const totalF = filtered.reduce((s, r) => s + r.jumlah_harga, 0); const totalObjF = { total_item: filtered.length, total_nilai: Math.round(totalF * 100) / 100 };
      const pagiF = hitungHalaman(filtered.length, halamanStok, PER_HALAMAN); halamanStok = pagiF.halamanSaatIni;
      const mulaiF = (halamanStok - 1) * PER_HALAMAN; const rowsF = filtered.slice(mulaiF, mulaiF + PER_HALAMAN);
      const containerTbl = document.querySelector('#stok-hasil .card:last-child');
      if (containerTbl) {
        containerTbl.querySelector('.table-wrap').innerHTML = renderTabelStok(rowsF, data.expiringSoon);
        containerTbl.querySelector('.paginasi').outerHTML = renderPaginasiHTML(filtered.length, halamanStok, pagiF.totalHalaman);
        containerTbl.querySelector('.totals').outerHTML = renderTotalHTML(totalObjF);
        attachPaginasiEvents(containerTbl, () => { halamanStok--; renderStokHasil(stokDataTerakhir); }, () => { halamanStok++; renderStokHasil(stokDataTerakhir); });
      }
    });
  }

  function renderTabelStok(rows, expiringSoon) {
    if (!rows.length) return '<div class="empty">Tidak ada data.</div>';
    const expiringKeys = {}; (expiringSoon || []).forEach(x => { expiringKeys[x.kode_barang + '||' + x.no_batch] = true; });
    let html = '<table><thead><tr><th>Foto</th><th>Nama Barang</th><th>No. Batch</th><th>Status</th><th class="num">Jumlah</th><th class="num">Harga</th><th class="num">Jumlah Harga</th><th>Tgl Expired</th></tr></thead><tbody>';
    rows.forEach(r => {
      const isAnomali = r.no_batch.indexOf('ANOMALI') !== -1; const isExpiring = expiringKeys[r.kode_barang + '||' + r.no_batch];
      const cls = isAnomali ? 'anomaly' : (isExpiring ? 'expiring' : '');
      html += `<tr class="${cls}"><td>${r.foto_url ? `<img class="foto-thumb" src="${r.foto_url}" alt="">` : '<div class="foto-placeholder">-</div>'}</td><td>${r.nama_barang}</td><td>${r.no_batch}${isAnomali ? ' <span class="badge bad">anomali</span>' : ''}</td><td>${r.status_kepemilikan || '-'}</td><td class="num">${r.jumlah.toLocaleString('id-ID')}</td><td class="num">${rupiah(r.harga)}</td><td class="num">${rupiah(r.jumlah_harga)}</td><td>${r.tgl_expired || '-'}</td></tr>`;
    });
    html += '</tbody></table>'; return html;
  }

  // ---------- MASTER BARANG ----------
  function renderMasterPanel() {
    pageContent.innerHTML = `
      <div class="card">
        <h3 id="master-form-title">Tambah Barang Baru</h3>
        <div class="sub" id="master-form-sub">Isi data barang, lalu simpan.</div>
        <form id="form-master">
          <div class="field-grid">
            <div class="field"><label>Kode Barang</label><input type="text" name="kode_barang" required style="text-transform:uppercase;"></div>
            <div class="field"><label>Nama Barang</label><input type="text" name="nama_barang" required></div>
            <div class="field"><label>Kategori</label><input type="text" name="kategori" list="kat-list"><datalist id="kat-list"><option>Plate</option><option>Screw</option></datalist></div>
            <div class="field"><label>Satuan</label><input type="text" name="satuan" value="pcs"></div>
            <div class="field"><label>Harga (Rp)</label><input type="number" name="harga_terakhir" min="0" required></div>
            <div class="field"><label>Status Kepemilikan</label><select name="status_kepemilikan" class="pilih-status-wajib" required></select></div>
            <div class="field full"><label>Foto (opsional)</label><input type="file" name="foto" accept="image/*"></div>
          </div>
          <button class="btn" type="submit" id="master-submit-btn">Tambah</button>
          <button class="btn secondary" type="button" id="master-batal-edit" style="display:none;">Batal Edit</button>
          <div class="msg" id="msg-master"></div>
        </form>
      </div>
      <div class="card" style="border: 2px dashed #0b5d5a;">
        <h3>📤 Import Master Barang dari CSV</h3>
        <div class="sub">Upload file CSV dengan header: kode_barang,nama_barang,kategori,satuan,harga_terakhir,status_kepemilikan</div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;"><input type="file" id="csv-upload" accept=".csv"><button class="btn" id="btn-import-csv">Import CSV</button><a href="#" onclick="downloadTemplateCSV(); return false;" style="font-size:13px;color:#0b5d5a;text-decoration:underline;cursor:pointer;">⬇ Download template CSV</a></div>
        <div class="msg" id="msg-csv-import"></div>
      </div>
      <div class="card">
        <h3>Daftar Barang</h3>

  async function handleFotoUpload(e) {

  // ---------- IMPORT CSV (REVISI BATCH) ----------
  async function handleImportCSV() {
    const input = document.getElementById('csv-upload'); const msg = document.getElementById('msg-csv-import'); const file = input.files && input.files[0];
    if (!file) { msg.textContent = 'Pilih file CSV terlebih dahulu.'; msg.className = 'msg show err'; return; }
    const reader = new FileReader();
    reader.onload = async function(e) {
      const text = e.target.result; const lines = text.split('\n').filter(line => line.trim() !== '');
      if (lines.length < 2) { msg.textContent = 'File CSV kosong atau hanya header.'; msg.className = 'msg show err'; return; }
      const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
      const expected = ['kode_barang', 'nama_barang', 'kategori', 'satuan', 'harga_terakhir', 'status_kepemilikan'];
      const missing = expected.filter(h => headers.indexOf(h) === -1);
      if (missing.length) { msg.textContent = 'Header tidak lengkap. Butuh: ' + expected.join(', '); msg.className = 'msg show err'; return; }
      const btn = document.getElementById('btn-import-csv'); btn.disabled = true; btn.textContent = 'Mengimpor...'; msg.className = 'msg';
      const dataArray = [];
      for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split(',').map(v => v.trim()); const data = {};
        headers.forEach((h, idx) => { data[h] = values[idx] || ''; });
        dataArray.push({ kode_barang: data.kode_barang, nama_barang: data.nama_barang, kategori: data.kategori || '', satuan: data.satuan || 'pcs', harga_terakhir: Number(data.harga_terakhir) || 0, status_kepemilikan: data.status_kepemilikan || 'Milik RS' });
      }
      try { const res = await apiCall('importBarangBatch', { items: dataArray }, 'POST'); msg.textContent = res.pesan || `✅ ${dataArray.length} barang berhasil diimport.`; msg.className = 'msg show ' + (res.sukses ? 'ok' : 'err'); if (res.sukses) muatMasterBarang(); }
      catch (err) { msg.textContent = 'Error: ' + err.message; msg.className = 'msg show err'; }
      finally { btn.disabled = false; btn.textContent = 'Import CSV'; input.value = ''; }
    };
    reader.onerror = function() { msg.textContent = 'Gagal membaca file.'; msg.className = 'msg show err'; };
    reader.readAsText(file);
  }

    pageContent.innerHTML = `<div class="card"><h3>Laporan Stok Opname Bulanan</h3><div class="sub">Rekap stok akhir periode.</div><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;"><div class="field"><label>Bulan</label><select id="opname-bulan"></select></div><div class="field"><label>Tahun</label><select id="opname-tahun"></select></div><div class="field"><label>Status</label><select id="opname-status"><option value="">Semua</option></select></div><button class="btn" id="btn-opname">Tampilkan</button><button class="btn secondary" id="btn-opname-export">Export</button></div><div class="msg" id="msg-opname"></div></div><div id="opname-hasil"></div>`;
    const now = new Date(); const selB = document.getElementById('opname-bulan'); const namaBulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des']; namaBulan.forEach((n, i) => selB.innerHTML += `<option value="${i+1}">${n}</option>`); selB.value = now.getMonth() + 1;
    const selT = document.getElementById('opname-tahun'); for (let y = now.getFullYear() - 2; y <= now.getFullYear() + 1; y++) selT.innerHTML += `<option value="${y}">${y}</option>`; selT.value = now.getFullYear();
    muatStatusDropdown('#opname-status'); document.getElementById('btn-opname').addEventListener('click', tampilkanOpname); document.getElementById('btn-opname-export').addEventListener('click', exportOpname);
  }
  async function tampilkanOpname() {
    const bulan = document.getElementById('opname-bulan').value; const tahun = document.getElementById('opname-tahun').value; const status = document.getElementById('opname-status').value;
    const msg = document.getElementById('msg-opname'); const btn = document.getElementById('btn-opname'); btn.disabled = true; btn.textContent = 'Memuat…'; msg.className = 'msg';
    try { const data = await apiCall('ambilLaporanOpname', { bulan, tahun, status: status || null }); opnameDataTerakhir = data; renderOpnameHasil(data); }
    catch (err) { msg.textContent = 'Gagal: ' + err.message; msg.className = 'msg show err'; } finally { btn.disabled = false; btn.textContent = 'Tampilkan'; }
  }
  function renderOpnameHasil(data) {
    const container = document.getElementById('opname-hasil'); let html = '';
    if (data.expiringSoon && data.expiringSoon.length) html += `<div class="card" style="background:#fbecdd;"><h3 style="color:#b4611e;">⚠ ${data.expiringSoon.length} batch mendekati kadaluarsa</h3></div>`;
    if (data.laporan.per_status && data.laporan.per_status.length) html += `<div class="card" style="display:flex;flex-wrap:wrap;gap:12px;">${data.laporan.per_status.map(s => `<div style="background:#e4f0ee;padding:8px 14px;border-radius:8px;"><strong>${s.status_kepemilikan}</strong><br>${s.total_item} item · ${rupiah(s.total_nilai)}</div>`).join('')}</div>`;
    const rows = data.laporan.rows; const total = rows.reduce((s, r) => s + r.jumlah_harga, 0); const totalObj = { total_item: rows.length, total_nilai: Math.round(total * 100) / 100 };
    html += `<div class="card"><div style="display:flex;gap:10px;margin-bottom:12px;"><input type="text" id="opname-cari" placeholder="Cari nama barang..." style="flex:1;padding:8px 12px;border:1px solid #d4dfdc;border-radius:6px;"></div><div class="table-wrap">${renderTabelStok(rows, data.expiringSoon)}</div>${renderTotalHTML(totalObj)}</div>`;
    container.innerHTML = html;
    document.getElementById('opname-cari').addEventListener('input', function() { const q = this.value.trim().toLowerCase(); const filtered = data.laporan.rows.filter(r => r.nama_barang.toLowerCase().includes(q)); const totalF = filtered.reduce((s, r) => s + r.jumlah_harga, 0); const totalObjF = { total_item: filtered.length, total_nilai: Math.round(totalF * 100) / 100 }; const tbl = container.querySelector('.table-wrap'); if (tbl) tbl.innerHTML = renderTabelStok(filtered, data.expiringSoon); const tot = container.querySelector('.totals'); if (tot) tot.outerHTML = renderTotalHTML(totalObjF); });
  }
  async function exportOpname() { const bulan = document.getElementById('opname-bulan').value; const tahun = document.getElementById('opname-tahun').value; const status = document.getElementById('opname-status').value; const msg = document.getElementById('msg-opname'); try { const res = await apiCall('exportLaporanKeSheetBaru', { bulan, tahun, status: status || null }, 'POST'); msg.textContent = 'Berhasil diekspor ke sheet "' + res.sheetName + '".'; msg.className = 'msg show ok'; } catch (err) { msg.textContent = 'Gagal ekspor: ' + err.message; msg.className = 'msg show err'; } }

  // ---------- PEMAKAIAN ----------
  function renderPemakaianPanel() {
    pageContent.innerHTML = `<div class="card"><h3>Laporan Pemakaian</h3><div class="sub">Daftar transaksi pengeluaran dalam rentang tanggal.</div><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;"><div class="field"><label>Dari</label><input type="date" id="pemakaian-mulai"></div><div class="field"><label>Sampai</label><input type="date" id="pemakaian-akhir"></div><div class="field"><label>Vendor</label><select id="pemakaian-status"><option value="">Semua</option></select></div><button class="btn" id="btn-pemakaian">Tampilkan</button><button class="btn secondary" id="btn-pemakaian-export">Export</button></div><div class="msg" id="msg-pemakaian"></div></div><div id="pemakaian-hasil"></div>`;
    const today = new Date().toISOString().slice(0,10); const awalBulan = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10); document.getElementById('pemakaian-mulai').value = awalBulan; document.getElementById('pemakaian-akhir').value = today; muatStatusDropdown('#pemakaian-status');
    document.getElementById('btn-pemakaian').addEventListener('click', tampilkanPemakaian); document.getElementById('btn-pemakaian-export').addEventListener('click', exportPemakaian);
  }
  async function tampilkanPemakaian() {
    const mulai = document.getElementById('pemakaian-mulai').value; const akhir = document.getElementById('pemakaian-akhir').value; const status = document.getElementById('pemakaian-status').value; const msg = document.getElementById('msg-pemakaian'); const btn = document.getElementById('btn-pemakaian'); if (!mulai || !akhir) return alert('Pilih tanggal.');
    btn.disabled = true; btn.textContent = 'Memuat…'; msg.className = 'msg';
    try { const data = await apiCall('ambilLaporanPemakaian', { mulai, akhir, status: status || null }); renderPemakaianHasil(data); } catch (err) { msg.textContent = 'Gagal: ' + err.message; msg.className = 'msg show err'; } finally { btn.disabled = false; btn.textContent = 'Tampilkan'; }
  }
  function renderPemakaianHasil(data) {
    const container = document.getElementById('pemakaian-hasil'); let html = '<div class="card"><h3>Transaksi</h3>';
    if (!data.transaksi.length) html += '<div class="empty">Tidak ada data.</div>'; else { let tbl = '<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Pasien</th><th>RM</th><th>Barang</th><th class="num">Jumlah</th><th>Vendor</th><th>Tujuan</th></tr></thead><tbody>'; data.transaksi.forEach(r => { tbl += `<tr><td>${r.tanggal}</td><td>${r.nama_pasien || '-'}</td><td>${r.no_rekam_medik || '-'}</td><td>${r.nama_barang}</td><td class="num">${r.jumlah.toLocaleString('id-ID')}</td><td>${r.status_kepemilikan}</td><td>${r.tujuan || '-'}</td></tr>`; }); tbl += '</tbody></table></div>'; html += tbl; }
    html += `<div class="totals"><div><span class="l">Total Transaksi</span><span class="n">${data.total_transaksi}</span></div><div><span class="l">Total Unit</span><span class="n">${data.total_unit_terpakai.toLocaleString('id-ID')}</span></div></div></div>`;
    html += '<div class="card"><h3>Rekap per Barang</h3>'; if (!data.rekap_per_barang.length) html += '<div class="empty">Tidak ada data.</div>'; else { let tbl = '<div class="table-wrap"><table><thead><tr><th>Barang</th><th class="num">Jml Transaksi</th><th class="num">Total Terpakai</th></tr></thead><tbody>'; data.rekap_per_barang.forEach(r => { tbl += `<tr><td>${r.nama_barang}</td><td class="num">${r.jumlah_transaksi}</td><td class="num">${r.total_terpakai.toLocaleString('id-ID')}</td></tr>`; }); tbl += '</tbody></table></div>'; html += tbl; } html += '</div>';
    container.innerHTML = html;
  }
  async function exportPemakaian() { const mulai = document.getElementById('pemakaian-mulai').value; const akhir = document.getElementById('pemakaian-akhir').value; const status = document.getElementById('pemakaian-status').value; const msg = document.getElementById('msg-pemakaian'); const btn = document.getElementById('btn-pemakaian-export'); btn.disabled = true; btn.textContent = 'Mengekspor…'; try { const res = await apiCall('exportLaporanPemakaianKeSheetBaru', { mulai, akhir, status: status || null }, 'POST'); msg.textContent = 'Berhasil diekspor ke sheet "' + res.sheetName + '".'; msg.className = 'msg show ok'; } catch (err) { msg.textContent = 'Gagal ekspor: ' + err.message; msg.className = 'msg show err'; } finally { btn.disabled = false; btn.textContent = 'Export'; } }

  // HELPERS
  function hitungHalaman(total, halaman, per) { const totalHalaman = Math.max(1, Math.ceil(total / per)); if (halaman > totalHalaman) halaman = totalHalaman; if (halaman < 1) halaman = 1; return { totalHalaman, halamanSaatIni: halaman }; }
  function renderPaginasiHTML(total, halaman, totalHalaman) { return `<div class="paginasi"><button class="btn-halaman" id="paging-prev" ${halaman <= 1 ? 'disabled' : ''}>‹ Sebelumnya</button><span>Halaman ${halaman} dari ${totalHalaman} · ${total} item</span><button class="btn-halaman" id="paging-next" ${halaman >= totalHalaman ? 'disabled' : ''}>Selanjutnya ›</button></div>`; }
  function attachPaginasiEvents(container, onPrev, onNext) { const prev = container.querySelector('#paging-prev'); const next = container.querySelector('#paging-next'); if (prev) prev.addEventListener('click', onPrev); if (next) next.addEventListener('click', onNext); }
  function renderTotalHTML(obj) { return `<div class="totals"><div><span class="l">Total Item</span><span class="n">${obj.total_item}</span></div><div><span class="l">Total Nilai</span><span class="n">${rupiah(obj.total_nilai)}</span></div></div>`; }
  document.getElementById('foto-modal-overlay').addEventListener('click', function(e) { if (e.target === this) tutupFotoModal(); }); document.getElementById('foto-modal-close').addEventListener('click', tutupFotoModal); document.addEventListener('keydown', function(e) { if (e.key === 'Escape') tutupFotoModal(); });
  function bukaFotoModal(url, altText) { if (!url) return; document.getElementById('foto-modal-img').src = url.replace(/sz=w\d+/, 'sz=w1200'); document.getElementById('foto-modal-img').alt = altText || 'Foto barang'; document.getElementById('foto-modal-overlay').classList.add('show'); }
  function tutupFotoModal() { document.getElementById('foto-modal-overlay').classList.remove('show'); document.getElementById('foto-modal-img').src = ''; }
  document.addEventListener('click', function(e) { if (e.target.classList.contains('foto-thumb')) { bukaFotoModal(e.target.getAttribute('src'), e.target.getAttribute('alt')); } });
  navigateTo('stok');
</script>
</body>
</html>
